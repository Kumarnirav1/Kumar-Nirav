<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ff5d0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5ff5d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ff5d0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screen"><rect x="20" y="50" width="780" height="290" rx="10"/></clipPath>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="820" height="360" rx="14" fill="#0a0f0f"/>
  <rect x="10" y="10" width="800" height="340" rx="12" fill="#0d1a1a" stroke="#2fd9b4" stroke-width="2"/>
  <circle cx="34" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="52" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="30" r="5" fill="#27c93f"/>
  <text x="410" y="34" fill="#5ff5d0" font-size="12" text-anchor="middle">YOUR-USERNAME@github:~ $ ./profile-scan --live</text>

  <!-- left: ASCII portrait placeholder (replace with your own ASCII art) -->
  <g fill="#5ff5d0" font-size="9" opacity="0.85">
    <text x="45" y="85">  .:-=+*##%%%%##*+=-:.  </text>
    <text x="45" y="97">  :+#%@@@@@@@@@@@@@@%#+: </text>
    <text x="45" y="109"> =%@@@@@@@@@@@@@@@@@@%= </text>
    <text x="45" y="121">.#@@@@@@%#*++*#%@@@@@@#.</text>
    <text x="45" y="133">+@@@@@%+:      :+%@@@@@+</text>
    <text x="45" y="145">%@@@@#:   ◉  ◉   :#@@@@%</text>
    <text x="45" y="157">%@@@@=     ..     =@@@@%</text>
    <text x="45" y="169">+@@@@%:   ====   :%@@@@+</text>
    <text x="45" y="181">.#@@@@%*:      :*%@@@@#.</text>
    <text x="45" y="193"> =%@@@@@@%*++*%@@@@@@%= </text>
    <text x="45" y="205">  :+#%@@@@@@@@@@@@%#+:  </text>
    <text x="45" y="217">    ':-=+*####*+=-:'    </text>
    <text x="45" y="245" fill="#2fd9b4" font-size="10">[ replace with your ASCII portrait ]</text>
  </g>

  <!-- right: data table -->
  <g font-size="13">
    <text x="330" y="80" fill="#2fd9b4" font-size="11">SYSTEM_DATA ─────────────────────────────</text>

    <text x="330" y="110" fill="#6b8f8a">Name</text>
    <text x="470" y="110" fill="#e6fffa">YOUR NAME</text>

    <text x="330" y="136" fill="#6b8f8a">Handle</text>
    <text x="470" y="136" fill="#e6fffa">@your-username</text>

    <text x="330" y="162" fill="#6b8f8a">Role</text>
    <text x="470" y="162" fill="#e6fffa">Full-Stack Dev | Security Enthusiast</text>

    <text x="330" y="188" fill="#6b8f8a">Status</text>
    <text x="470" y="188" fill="#e6fffa">Building | Learning | Shipping</text>

    <text x="330" y="214" fill="#6b8f8a">Languages</text>
    <text x="470" y="214" fill="#e6fffa">Python, JavaScript, TypeScript</text>

    <text x="330" y="240" fill="#6b8f8a">Focus</text>
    <text x="470" y="240" fill="#e6fffa">Log analysis, web apps, automation</text>

    <text x="330" y="266" fill="#6b8f8a">Projects</text>
    <text x="470" y="266" fill="#e6fffa">Brute-force log analyzer, Job tracker</text>

    <text x="330" y="292" fill="#6b8f8a">Contact</text>
    <text x="470" y="292" fill="#e6fffa">github.com/your-username</text>

    <!-- blinking cursor -->
    <rect x="330" y="310" width="9" height="14" fill="#5ff5d0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- animated scanline -->
  <g clip-path="url(#screen)">
    <rect x="20" y="-60" width="780" height="60" fill="url(#scan)">
      <animate attributeName="y" values="40;340;40" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
